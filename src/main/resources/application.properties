server.port=8082
spring.application.name=room-service
server.servlet.context-path=${SERVER_CONTEXT_PATH:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/room_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:room_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:room_service}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.redis.cluster.nodes=${SPRING_REDIS_CLUSTER_NODES:localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
room.rtmp-url=rtmp://rtmp.team9.cloud.skala-ai.com/live
room.join-token-secret=${ROOM_JOIN_TOKEN_SECRET:room-service-dev-secret}
room.rtmp-callback-secret=${RTMP_CALLBACK_SECRET:rtmp-dev-secret}
room.categories=${ROOM_CATEGORIES:게임,토크,음악,스포츠,요리,예술,크리에이티브,학습}
